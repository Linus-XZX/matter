name: Flutter Checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter and bridge
        uses: ./.github/actions/setup-flutter-bridge
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Dart tests
        run: flutter test
