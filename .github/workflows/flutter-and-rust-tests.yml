name: Flutter and Rust Tests

on:
  workflow_dispatch:

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  flutter-and-rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter and bridge
        uses: ./.github/actions/setup-flutter-bridge
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          rust-tests: 'true'

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Dart tests
        run: flutter test

      - name: Test application Rust crate
        run: cargo test --manifest-path rust/Cargo.toml --locked

      - name: Test vendored search crate
        run: >-
          cargo test --manifest-path rust/vendor/matrix-sdk-search/Cargo.toml
          --locked

      - name: Clippy application Rust crate
        run: cargo clippy --manifest-path rust/Cargo.toml --locked

      - name: Clippy vendored search crate
        run: >-
          cargo clippy --manifest-path rust/vendor/matrix-sdk-search/Cargo.toml
          --locked
