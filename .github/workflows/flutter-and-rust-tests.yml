name: Flutter and Rust Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  flutter-and-rust-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Generate Flutter Rust Bridge bindings
        run: |
          cargo install flutter_rust_bridge_codegen@2.13.0 cargo-expand
          flutter_rust_bridge_codegen generate

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Dart tests
        run: flutter test

      - name: Test application Rust crate
        run: cargo test --manifest-path rust/Cargo.toml --locked

      - name: Test vendored search crate
        run: cargo test --manifest-path rust/vendor/matrix-sdk-search/Cargo.toml

      - name: Clippy application Rust crate
        run: cargo clippy --manifest-path rust/Cargo.toml --locked

      - name: Clippy vendored search crate
        run: cargo clippy --manifest-path rust/vendor/matrix-sdk-search/Cargo.toml --locked
